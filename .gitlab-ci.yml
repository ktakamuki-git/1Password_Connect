workflow:
  rules:
    # Runtime diagnostics are opt-in on API pipelines only.
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "codex/1password-connect-design-review" && $CONNECT_RUNTIME_DIAGNOSTICS == "true"'
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "codex/1password-connect-design-review"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "codex/1password-connect-design-review"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == "codex/1password-connect-design-review"'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - verify

.static-mock-site:
  stage: verify
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "codex/1password-connect-design-review"'
      when: never
    - when: on_success
  script:
    - |
      set -euo pipefail
      project_root="${CI_PROJECT_DIR:?CI_PROJECT_DIR is required}"
      cd "$project_root"
      tool_dir="$(mktemp -d "$project_root/.ci-tools.XXXXXX")"
      credential_placeholder="$tool_dir/empty-connect-credentials.json"
      node_modules_dir="$project_root/plugins/onepassword-connect/node_modules"
      trap 'rm -rf "$tool_dir" "$node_modules_dir"' EXIT
      : > "$credential_placeholder"

      for required_command in curl sha256sum tar xz python3; do
        if ! command -v "$required_command" >/dev/null 2>&1; then
          echo "Required host utility is unavailable: $required_command"
          exit 1
        fi
      done
      test "$(uname -m)" = "x86_64" || { echo "Expected x86_64 Linux runner."; exit 1; }

      node_url="https://nodejs.org/dist/v24.22.0/node-v24.22.0-linux-x64.tar.xz"
      echo "Downloading official Node.js archive: $node_url"
      curl --fail --location --show-error --output "$tool_dir/node.tar.xz" "$node_url"
      printf '%s  %s\n' "cc2f601cee82d9a5a233302fe307abc600727035fd7d2c3a3571755989e95008" "$tool_dir/node.tar.xz" | sha256sum --check -
      mkdir "$tool_dir/node"
      tar -xJf "$tool_dir/node.tar.xz" -C "$tool_dir/node" --strip-components=1
      export PATH="$tool_dir/node/bin:$PATH"
      test "$(node --version)" = "v24.22.0"
      node --version
      npm --version

      npm_config_registry="https://registry.npmjs.org/" npm_config_cache="$tool_dir/npm-cache" npm ci --no-audit --no-fund --cache "$tool_dir/npm-cache" --prefix "$project_root/plugins/onepassword-connect" --ignore-scripts=false
      (cd plugins/onepassword-connect && npm run check && npm test)

      pip_wheel_url="https://files.pythonhosted.org/packages/f3/6e/1736e5b4ae2b778ef2f81c47d797de9f891d4d8acb047a24ca37a60294dd/pip-26.2.1-py3-none-any.whl"
      echo "Downloading pinned pip wheel: $pip_wheel_url"
      curl --fail --location --show-error --output "$tool_dir/pip-26.2.1-py3-none-any.whl" "$pip_wheel_url"
      printf '%s  %s\n' "71138adf1f4ca900cdb7d289c21b7494329f2332b6d85f0e1c42108c0384ed3e" "$tool_dir/pip-26.2.1-py3-none-any.whl" | sha256sum --check -
      export PYTHONPATH="$tool_dir/python:$tool_dir/pip-26.2.1-py3-none-any.whl"
      export PIP_CONFIG_FILE=/dev/null
      export PIP_INDEX_URL="https://pypi.org/simple"
      export PIP_CACHE_DIR="$tool_dir/pip-cache"
      python3 -m pip --version
      python3 -m pip install --disable-pip-version-check --no-input --no-user --no-compile --only-binary=:all: --target "$tool_dir/python" -r tests/requirements.txt
      python3 -m unittest discover -s tests -v

      compose_release_url="https://github.com/docker/compose/releases/download/v5.6.0"
      checksums_url="$compose_release_url/checksums.txt"
      echo "Downloading official Docker Compose checksum list: $checksums_url"
      curl --fail --location --show-error --output "$tool_dir/compose-checksums.txt" "$checksums_url"
      printf '%s  %s\n' "40d09e5c4e2f2e24f99c0520cbd29c02d816b58800b4e11070318cffe03c6fbd" "$tool_dir/compose-checksums.txt" | sha256sum --check -
      compose_url="$compose_release_url/docker-compose-linux-x86_64"
      echo "Downloading official Docker Compose standalone: $compose_url"
      curl --fail --location --show-error --output "$tool_dir/docker-compose" "$compose_url"
      compose_sha="$(awk '{ name = $NF; sub(/^[*]/, "", name); n = split(name, parts, "/"); if (parts[n] == "docker-compose-linux-x86_64" && $1 ~ /^[[:xdigit:]]+$/) { print $1; exit } }' "$tool_dir/compose-checksums.txt")"
      case "$compose_sha" in
        ''|*[!0123456789abcdefABCDEF]*) echo "Docker Compose checksum entry is missing or invalid."; exit 1 ;;
      esac
      test "${#compose_sha}" -eq 64 || { echo "Docker Compose checksum entry is missing or invalid."; exit 1; }
      printf '%s  %s\n' "$compose_sha" "$tool_dir/docker-compose" | sha256sum --check -
      chmod +x "$tool_dir/docker-compose"
      "$tool_dir/docker-compose" --version
      CONNECT_CREDENTIALS_FILE="$credential_placeholder" "$tool_dir/docker-compose" -f deploy/docker/compose.yaml config >/dev/null

site-appv4:
  extends: .static-mock-site
  tags: [appv4]

site-ubutsu2:
  extends: .static-mock-site
  tags: [ubutsu2]

site-oyama-wsl:
  extends: .static-mock-site
  tags: [oyama-wsl]

oyama-runtime-diagnostics:
  stage: verify
  tags: [oyama-wsl]
  variables:
    CI_DEBUG_TRACE: "false"
    CI_DEBUG_SERVICES: "false"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "codex/1password-connect-design-review" && $CONNECT_RUNTIME_DIAGNOSTICS == "true"'
    - when: never
  script:
    - bash -n deploy/docker/oyama_runtime_diagnostics.sh
    - bash deploy/docker/oyama_runtime_diagnostics.sh
