name: Deploy Connect (qemu/117)

on:
  push:
    branches: [main]
    paths:
      - 'Infra/qemu-117/**'
      - 'deploy/docker/**'
      - 'deploy/systemd/**'
      - 'scripts/deploy_qemu117.sh'
      - '.github/workflows/deploy-qemu117.yml'
  workflow_dispatch:

concurrency:
  group: connect-qemu117
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, vm-infrastructure]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Connect stack
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export REPO="${GITHUB_WORKSPACE}"
          bash "${GITHUB_WORKSPACE}/scripts/deploy_qemu117.sh"
